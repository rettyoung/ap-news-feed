name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for u in https://apnews.com/hub/apf-topnews https://apnews.com/ https://apnews.com/sitemap.xml https://apnews.com/news-sitemap-content.xml https://apnews.com/robots.txt; do
            echo "== $u"
            curl -s -o /tmp/b -D /tmp/h -w "curl-browserUA: %{http_code} %{size_download}B http%{http_version}\n" -A "$UA" -H "Accept: text/html,application/xhtml+xml" -H "Accept-Language: en-US,en;q=0.9" --compressed "$u"
            grep -iE "^(server|cf-ray|x-akamai|x-cache|via):" /tmp/h || true
            head -c 300 /tmp/b | tr '\n' ' '; echo
            curl -s -o /dev/null -w "curl-defaultUA: %{http_code}\n" "$u"
          done
          python3 -c "import urllib.request as r;print('urllib:',r.urlopen(r.Request('https://apnews.com/hub/apf-topnews',headers={'User-Agent':'Mozilla/5.0'})).status)" 2>&1 | tail -1
          grep -oE 'apnews\.com/article/[a-z0-9-]+' /dev/null || true
          curl -s -A "$UA" --compressed https://apnews.com/hub/apf-topnews | grep -oE '/article/[a-z0-9-]+' | sort -u | wc -l
